name: 'Helm Publish Action'
description: 'Github Action to simplify Helm Chart publish into a Registry'
branding:
  icon: package
  color: yellow
inputs:
  workingDirectory:
    description: 'Working directory'
    default: '.'
    required: false
  tailscaleKey:
    description: 'Tailscale AuthKey'
    default: ''
    required: false
  repository:
    description: 'URL of your repository. A Chartmuseum URL (https://...) or an OCI registry path (oci://registry/project)'
    required: true
  ociRepository:
    description: 'Optional OCI registry path (oci://registry/project) to publish to as well, while consumers move off Chartmuseum'
    default: ''
    required: false
  username:
    description: 'Username to use on your repository'
    required: true
  password:
    description: 'Password to use on your repository'
    required: true
  buildDependencies:
    description: 'Build dependencies before push'
    default: 'false'
  updateDependencies:
    description: 'Update dependencies before push'
    default: 'false'
  beforeHook:
    description: 'Command to execute before publishing'
    default: ''
    required: false
runs:
  using: "composite"
  steps:
    - name: Install Helm
      shell: bash
      run: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        if [[ "${{ inputs.repository }}" != oci://* ]]; then
          helm plugin install https://github.com/chartmuseum/helm-push
        fi

    - name: Tailscale
      uses: tailscale/github-action@v4
      if: ${{ inputs.tailscaleKey != '' }}
      with:
        authkey: ${{ inputs.tailscaleKey }}

    - name: Add repository
      shell: bash
      if: ${{ !startsWith(inputs.repository, 'oci://') }}
      run: |
        helm repo add charts ${{ inputs.repository }}

    # One login covers both OCI targets: they live on the same registry.
    - name: Registry login
      shell: bash
      if: ${{ startsWith(inputs.repository, 'oci://') || inputs.ociRepository != '' }}
      env:
        REGISTRY_PASSWORD: ${{ inputs.password }}
      run: |
        target="${{ inputs.ociRepository }}"
        [[ -z "$target" ]] && target="${{ inputs.repository }}"
        host="${target#oci://}"; host="${host%%/*}"
        echo "$REGISTRY_PASSWORD" | helm registry login "$host" --username '${{ inputs.username }}' --password-stdin

    - name: Execute Before Hook
      shell: bash
      if: ${{ inputs.beforeHook != '' }}
      working-directory: ${{ inputs.workingDirectory }}
      run: ${{ inputs.beforeHook }}

    - name: Update dependencies
      shell: bash
      if: ${{ inputs.updateDependencies == 'true' }}
      working-directory: ${{ inputs.workingDirectory }}
      env:
        HELM_REPO_USERNAME: ${{ inputs.username }}
        HELM_REPO_PASSWORD: ${{ inputs.password }}
      run: |
        helm dependencies update

    - name: Build dependencies
      shell: bash
      if: ${{ inputs.buildDependencies == 'true' }}
      working-directory: ${{ inputs.workingDirectory }}
      env:
        HELM_REPO_USERNAME: ${{ inputs.username }}
        HELM_REPO_PASSWORD: ${{ inputs.password }}
      run: |
        helm dependencies build

    - name: Lint
      shell: bash
      working-directory: ${{ inputs.workingDirectory }}
      run: |
        helm lint

    - name: Publish
      shell: bash
      working-directory: ${{ inputs.workingDirectory }}
      env:
        HELM_REPO_USERNAME: ${{ inputs.username }}
        HELM_REPO_PASSWORD: ${{ inputs.password }}
      run: |
        if [[ "${{ inputs.repository }}" == oci://* ]]; then
          "$GITHUB_ACTION_PATH/oci-push.sh" '${{ inputs.repository }}'
        else
          helm cm-push . charts
        fi

    - name: Publish to OCI as well
      shell: bash
      if: ${{ inputs.ociRepository != '' }}
      working-directory: ${{ inputs.workingDirectory }}
      run: |
        "$GITHUB_ACTION_PATH/oci-push.sh" '${{ inputs.ociRepository }}'